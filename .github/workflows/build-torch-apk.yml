name: Build Torch APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-torch-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/kastinetech/torch
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "KastineTorch"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.kastinetech.torch"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.kastinetech.torch"
                  minSdk = 23
                  targetSdk = 28
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:name="android.hardware.camera.flash" android:required="false" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <application
                  android:allowBackup="false"
                  android:label="Kastine Torch"
                  android:theme="@style/AppTheme"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#FFC857</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#101116</item>
                  <item name="android:navigationBarColor">#101116</item>
                  <item name="android:windowLightNavigationBar">false</item>
                  <item name="android:windowActionModeOverlay">true</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/kastinetech/torch/MainActivity.kt <<'EOF'
          package com.kastinetech.torch

          import android.Manifest
          import android.app.Activity
          import android.content.Context
          import android.content.pm.PackageManager
          import android.hardware.camera2.CameraAccessException
          import android.hardware.camera2.CameraManager
          import android.os.BatteryManager
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.os.VibratorManager
          import android.view.Gravity
          import android.view.View
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable

          class MainActivity : Activity() {
              private lateinit var cameraManager: CameraManager
              private var cameraId: String? = null
              private var torchOn = false
              private var sosOn = false
              private var strobeOn = false
              private var pulseState = false
              private var batteryText: TextView? = null
              private var statusText: TextView? = null
              private var powerButton: Button? = null
              private val handler = Handler(Looper.getMainLooper())
              private val sosPattern = listOf(
                  200L, 200L, 200L, 600L, 600L, 200L, 600L, 200L, 600L, 600L,
                  200L, 200L, 200L, 1400L
              )
              private var sosIndex = 0
              private var sosRunnable: Runnable? = null
              private var strobeRunnable: Runnable? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = Color.rgb(16, 17, 22)
                  window.navigationBarColor = Color.rgb(16, 17, 22)
                  cameraManager = getSystemService(Context.CAMERA_SERVICE) as CameraManager
                  cameraId = try {
                      cameraManager.cameraIdList.firstOrNull { id ->
                          cameraManager.getCameraCharacteristics(id)
                              .get(android.hardware.camera2.CameraCharacteristics.FLASH_INFO_AVAILABLE) == true
                      }
                  } catch (_: Exception) { null }
                  buildUi()
                  updateBattery()
                  updateUi()
              }

              private fun buildUi() {
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(dp(24), dp(24), dp(24), dp(24))
                      setBackgroundColor(Color.rgb(16, 17, 22))
                  }

                  val brand = TextView(this).apply {
                      text = "KASTINE TECH"
                      textSize = 13f
                      letterSpacing = 0.22f
                      setTextColor(Color.rgb(255, 200, 87))
                      gravity = Gravity.CENTER
                  }
                  root.addView(brand, matchWrap())

                  val title = TextView(this).apply {
                      text = "TORCH"
                      textSize = 30f
                      typeface = Typeface.create("sans-serif", Typeface.BOLD)
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      setPadding(0, dp(8), 0, dp(4))
                  }
                  root.addView(title, matchWrap())

                  batteryText = TextView(this).apply {
                      textSize = 14f
                      setTextColor(Color.rgb(170, 174, 188))
                      gravity = Gravity.CENTER
                  }
                  root.addView(batteryText, matchWrap())

                  val spacer = View(this)
                  root.addView(spacer, LinearLayout.LayoutParams(1, dp(34)))

                  powerButton = Button(this).apply {
                      text = "⏻"
                      textSize = 54f
                      typeface = Typeface.DEFAULT
                      isAllCaps = false
                      setTextColor(Color.rgb(16, 17, 22))
                      background = rounded(Color.rgb(255, 200, 87), 1000)
                      elevation = dp(8).toFloat()
                      setOnClickListener {
                          stopSpecialModes()
                          setTorch(!torchOn)
                          vibrate()
                      }
                  }
                  val powerParams = LinearLayout.LayoutParams(dp(190), dp(190))
                  powerParams.gravity = Gravity.CENTER
                  root.addView(powerButton, powerParams)

                  statusText = TextView(this).apply {
                      textSize = 15f
                      setTextColor(Color.rgb(170, 174, 188))
                      gravity = Gravity.CENTER
                      setPadding(0, dp(18), 0, dp(26))
                  }
                  root.addView(statusText, matchWrap())

                  val row = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER
                  }
                  val sosButton = makeButton("SOS") { toggleSos() }
                  val strobeButton = makeButton("STROBE") { toggleStrobe() }
                  row.addView(sosButton, LinearLayout.LayoutParams(0, dp(54), 1f).apply {
                      marginEnd = dp(8)
                  })
                  row.addView(strobeButton, LinearLayout.LayoutParams(0, dp(54), 1f).apply {
                      marginStart = dp(8)
                  })
                  root.addView(row, LinearLayout.LayoutParams(-1, dp(54)))

                  val note = TextView(this).apply {
                      text = "Use responsibly. Flash patterns may affect people sensitive to flashing lights."
                      textSize = 11f
                      setTextColor(Color.rgb(125, 130, 145))
                      gravity = Gravity.CENTER
                      setPadding(dp(8), dp(24), dp(8), 0)
                  }
                  root.addView(note, matchWrap())
                  setContentView(root)
              }

              private fun makeButton(label: String, action: () -> Unit): Button =
                  Button(this).apply {
                      text = label
                      textSize = 14f
                      isAllCaps = false
                      setTextColor(Color.WHITE)
                      background = rounded(Color.rgb(42, 44, 54), 18)
                      setOnClickListener { action() }
                  }

              private fun rounded(color: Int, radius: Int): GradientDrawable =
                  GradientDrawable().apply {
                      setColor(color)
                      cornerRadius = dp(radius).toFloat()
                  }

              private fun matchWrap() = LinearLayout.LayoutParams(-1, -2)
              private fun dp(value: Int): Int = (value * resources.displayMetrics.density).toInt()

              private fun setTorch(enabled: Boolean) {
                  val id = cameraId
                  if (id == null) {
                      Toast.makeText(this, "No compatible flashlight found on this device.", Toast.LENGTH_LONG).show()
                      return
                  }
                  if (checkSelfPermission(Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                      stopSpecialModes()
                      requestPermissions(arrayOf(Manifest.permission.CAMERA), 1001)
                      Toast.makeText(this, "Allow camera permission, then tap the torch button again.", Toast.LENGTH_LONG).show()
                      return
                  }
                  try {
                      cameraManager.setTorchMode(id, enabled)
                      torchOn = enabled
                      updateUi()
                  } catch (_: CameraAccessException) {
                      Toast.makeText(this, "Flashlight is unavailable. Close other camera apps and try again.", Toast.LENGTH_LONG).show()
                  } catch (_: SecurityException) {
                      Toast.makeText(this, "Android did not allow flashlight access.", Toast.LENGTH_LONG).show()
                  } catch (_: Exception) {
                      Toast.makeText(this, "Couldn't change flashlight state on this device.", Toast.LENGTH_LONG).show()
                  }
              }

              private fun updateUi() {
                  powerButton?.text = if (torchOn) "⏻" else "⏻"
                  powerButton?.background = rounded(
                      if (torchOn) Color.WHITE else Color.rgb(255, 200, 87), 1000
                  )
                  statusText?.text = when {
                      sosOn -> "SOS MODE ACTIVE"
                      strobeOn -> "STROBE MODE ACTIVE"
                      torchOn -> "FLASHLIGHT ON"
                      else -> "FLASHLIGHT OFF"
                  }
              }

              private fun toggleSos() {
                  if (sosOn) {
                      stopSpecialModes()
                      setTorch(false)
                      return
                  }
                  stopSpecialModes()
                  sosOn = true
                  sosIndex = 0
                  runSosStep()
                  updateUi()
              }

              private fun runSosStep() {
                  if (!sosOn) return
                  val onDuration = sosPattern[sosIndex % sosPattern.size]
                  pulseState = !pulseState
                  setTorch(pulseState)
                  sosRunnable = Runnable {
                      if (sosOn) {
                          sosIndex++
                          runSosStep()
                      }
                  }
                  handler.postDelayed(sosRunnable!!, onDuration)
              }

              private fun toggleStrobe() {
                  if (strobeOn) {
                      stopSpecialModes()
                      setTorch(false)
                      return
                  }
                  stopSpecialModes()
                  strobeOn = true
                  pulseState = false
                  val task = object : Runnable {
                      override fun run() {
                          if (!strobeOn) return
                          pulseState = !pulseState
                          setTorch(pulseState)
                          handler.postDelayed(this, 250)
                      }
                  }
                  strobeRunnable = task
                  handler.post(task)
                  updateUi()
              }

              private fun stopSpecialModes() {
                  sosOn = false
                  strobeOn = false
                  sosRunnable?.let { handler.removeCallbacks(it) }
                  strobeRunnable?.let { handler.removeCallbacks(it) }
                  sosRunnable = null
                  strobeRunnable = null
                  pulseState = false
              }

              private fun updateBattery() {
                  val manager = getSystemService(Context.BATTERY_SERVICE) as BatteryManager
                  val level = manager.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY)
                  batteryText?.text = if (level in 0..100) "Battery  •  $level%" else "Battery level unavailable"
              }

              private fun vibrate() {
                  try {
                      val vibrator = if (Build.VERSION.SDK_INT >= 31) {
                          (getSystemService(Context.VIBRATOR_MANAGER_SERVICE) as VibratorManager).defaultVibrator
                      } else {
                          @Suppress("DEPRECATION")
                          getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
                      }
                      if (Build.VERSION.SDK_INT >= 26) {
                          vibrator.vibrate(VibrationEffect.createOneShot(35, VibrationEffect.DEFAULT_AMPLITUDE))
                      } else {
                          @Suppress("DEPRECATION")
                          vibrator.vibrate(35)
                      }
                  } catch (_: Exception) { }
              }

              override fun onPause() {
                  super.onPause()
                  // Keep the selected light running when the app is briefly backgrounded.
                  // Android/device policies may still turn the torch off.
              }

              override fun onDestroy() {
                  stopSpecialModes()
                  if (torchOn) setTorch(false)
                  super.onDestroy()
              }
          }
          EOF

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KastineTorch-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
